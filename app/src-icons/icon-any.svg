      <stop offset="0" stop-color="#8B6BFF"/>
      <stop offset="1" stop-color="#6A4EEA"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- cartão/carteira estilizado atrás do monograma, pra ancorar "finanças" -->
