  <rect x="96" y="168" width="320" height="54" rx="28" fill="#FFFFFF" opacity="0.22"/>

  <text x="256" y="322" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-weight="800" font-size="168" fill="#FFFFFF">JR</text>

  <!-- selo de cifrão no canto, referência visual ao app de finanças -->
