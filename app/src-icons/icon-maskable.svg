<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8B6BFF"/>
      <stop offset="1" stop-color="#6A4EEA"/>
    </linearGradient>
  </defs>

  <!-- Sem cantos arredondados aqui: o Android aplica a própria máscara
       (círculo, squircle, etc.) por cima, então o fundo precisa ir até a
       borda. O conteúdo importante (JR + selo) fica dentro da "zona segura"
       central (~66% do quadro), pra nunca ser cortado pela máscara. -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <rect x="126" y="196" width="260" height="180" rx="22" fill="#FFFFFF" opacity="0.14"/>
  <rect x="126" y="196" width="260" height="44" rx="22" fill="#FFFFFF" opacity="0.22"/>

  <text x="256" y="318" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-weight="800" font-size="132" fill="#FFFFFF">JR</text>

  <circle cx="358" cy="356" r="36" fill="#FF7A9C"/>
  <text x="358" y="369" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-weight="800" font-size="36" fill="#FFFFFF">$</text>
</svg>
